[package]
name = "iq"
version = "0.1.0"
edition = "2021"
description = "Durable repository integration queue"
license = "MIT"
repository = "https://github.com/kevin-courbet/iq"

[[bin]]
name = "iq"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
shell-words = "1.1"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
wait-timeout = "0.2"
libc = "0.2"
tempfile = "3.10"
